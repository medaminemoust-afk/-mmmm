name: ios ipa

on:
  workflow_dispatch:
  push:
    branches:
      - ios-build
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # The site is committed inside ios/VibeApp/Web, exactly as it was validated on the
      # Android build, so the IPA is built from a fixed bundle instead of a fresh npm install.
      - name: Check the bundled site
        run: |
          test -f ios/VibeApp/Web/index.html || { echo "ios/VibeApp/Web/index.html is missing"; exit 1; }
          du -sh ios/VibeApp/Web

      # The app icon is the same artwork the web bundle uses; sips scales it to the 1024 size
      # an AppIcon set needs, so no second copy has to be kept in the repository.
      - name: App icon
        run: |
          ICONSET=ios/VibeApp/Assets.xcassets/AppIcon.appiconset
          sips -z 1024 1024 ios/VibeApp/Web/icon-512.png --out "$ICONSET/icon-1024.png"
          sips -g pixelWidth -g pixelHeight "$ICONSET/icon-1024.png"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: cd ios && xcodegen generate

      - name: Build unsigned
        shell: bash
        run: |
          set -o pipefail
          cd ios
          xcodebuild archive \
            -project VibeApp.xcodeproj \
            -scheme VibeApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/VibeApp.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee build.log

      # A public log release keeps the compiler output readable without a GitHub account.
      - name: Share the build log
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd ios
          [ -f build.log ] || echo "no build log" > build.log
          TAG="log-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" build.log \
            --repo "${{ github.repository }}" \
            --title "vibe iOS build log $TAG" \
            --notes "Compiler output of run ${GITHUB_RUN_NUMBER}." || true
          echo "log: https://github.com/${{ github.repository }}/releases/download/$TAG/build.log"

      - name: Package the IPA
        run: |
          cd ios
          APP=build/VibeApp.xcarchive/Products/Applications/VibeApp.app
          test -f "$APP/Web/index.html" || { echo "the bundled site is missing from $APP"; ls -R "$APP" | head -40; exit 1; }
          du -sh "$APP/Web"
          rm -rf build/Payload vibe-unsigned.ipa
          mkdir -p build/Payload
          cp -R build/VibeApp.xcarchive/Products/Applications/VibeApp.app build/Payload/
          cd build
          zip -qry ../vibe-unsigned.ipa Payload
          ls -l ../vibe-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: vibe-ios-unsigned
          path: ios/vibe-unsigned.ipa
          if-no-files-found: error

      # A public release asset can be downloaded from the download page without a GitHub token.
      # A plain branch is the reliable way off the runner without an API key: raw.githubusercontent
      # serves it to the download site, and the build no longer depends on the release API.
      - name: Publish the IPA on the ipa branch
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          rm -rf ipa && mkdir ipa && cd ipa
          git init -q
          git config user.name "vibe ci"
          git config user.email "ci@vibe.invalid"
          cp "$GITHUB_WORKSPACE/ios/vibe-unsigned.ipa" vibe-1.8.9-unsigned.ipa
          git add vibe-1.8.9-unsigned.ipa
          git commit -q -m "vibe iOS unsigned IPA ${GITHUB_RUN_NUMBER}"
          git branch -M ipa
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git push -f origin ipa
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Publish the IPA as a release asset
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd ios
          TAG="ios-${GITHUB_RUN_NUMBER}"
          for attempt in 1 2 3 4 5; do
            if gh release create "$TAG" vibe-unsigned.ipa \
              --repo "${{ github.repository }}" \
              --title "vibe iOS unsigned IPA ($TAG)" \
              --notes "Unsigned IPA built from ${{ github.sha }}. Install with Sideloadly and a free Apple ID." \
              --latest; then
              echo "asset: https://github.com/${{ github.repository }}/releases/download/$TAG/vibe-unsigned.ipa"
              exit 0
            fi
            echo "release attempt ${attempt} failed (GitHub answered an error); retrying in 25s"
            sleep 25
          done
          echo "the IPA was built and uploaded as an artifact, but GitHub refused to publish the release"
          exit 1
